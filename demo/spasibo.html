<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Спасибо – демо модуля виджетов</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="vidzhety.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1b1f2a; background: #fff; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    .demo-flag { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #fff3cd; color: #7a5a00; font-size: 13px; font-weight: 600; }
    h1 { font-size: 32px; margin: 12px 0; }
    .journal { max-height: 300px; overflow: auto; padding: 10px 12px 10px 28px; background: #10162b; color: #dfe5f5; border-radius: 10px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  </style>
</head>
<body data-w-quiet>
  <div class="wrap">
    <span class="demo-flag">Демо модуля виджетов</span>
    <h1>Спасибо, заявка принята</h1>
    <p>Это «тихая» страница: у <code>&lt;body&gt;</code> стоит <code>data-w-quiet</code>, поэтому ни один виджет здесь сам не появляется –
      ни ярлычок, ни плашка, ни окно на уходе, ни липкая панель. По клику человека виджет открыть можно.</p>
    <p><a id="back" href="index.html">← Вернуться на демо-страницу</a></p>
    <h2>Журнал решений</h2>
    <ol class="journal" data-w-journal aria-live="polite"></ol>
  </div>
  <div data-vidzhety data-src="vidzhety.json"></div>
  <script>document.getElementById('back').href = 'index.html' + location.search;</script>
  <script src="vidzhety-zhurnal.js"></script>
  <script src="vidzhety.js"></script>
</body>
</html>
